<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A forearm raised up the left edge holding a Burgundy glass; MANIFESTO runs up the arm; ENJOY IT MIGHTILY beside it">
  <defs>
    <filter id="cut-c" x="-10%" y="-5%" width="120%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="bowl-c"><path d="M150 300 C70 296 36 220 40 150 C44 95 70 55 85 40 L215 40 C230 55 256 95 260 150 C264 220 230 296 150 300 Z"/></clipPath>
  </defs>
  <rect width="600" height="1000" fill="#f4ecd8"/>

  <g filter="url(#cut-c)">
    <!-- forearm: thick, tapering a little to the wrist -->
    <path d="M62 1000 C68 820 80 660 96 540 L204 540 C220 660 232 820 238 1000 Z" fill="#1b1917"/>
    <!-- fist body -->
    <rect x="92" y="398" width="118" height="150" rx="34" fill="#1b1917"/>
    <!-- four fingers curled toward the viewer -->
    <rect x="78" y="404" width="92" height="30" rx="15" fill="#1b1917"/>
    <rect x="76" y="436" width="94" height="30" rx="15" fill="#1b1917"/>
    <rect x="78" y="468" width="92" height="30" rx="15" fill="#1b1917"/>
    <rect x="84" y="500" width="86" height="28" rx="14" fill="#1b1917"/>
    <!-- gouge lines between the fingers -->
    <path d="M86 435 L166 435" stroke="#f4ecd8" stroke-width="3" stroke-linecap="round"/>
    <path d="M84 467 L166 467" stroke="#f4ecd8" stroke-width="3" stroke-linecap="round"/>
    <path d="M88 499 L164 499" stroke="#f4ecd8" stroke-width="3" stroke-linecap="round"/>
    <!-- thumb laid across the top, the stem passing beside it -->
    <path d="M120 418 C118 400 134 392 150 394 L196 404 C212 408 212 430 196 432 L156 426 C140 426 124 430 120 418 Z" fill="#1b1917"/>
    <path d="M128 418 C140 414 156 414 168 418" stroke="#f4ecd8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- stem, held between thumb and first finger -->
  <rect x="146" y="296" width="8" height="112" fill="#1b1917"/>

  <!-- wine -->
  <g clip-path="url(#bowl-c)">
    <rect x="0" y="186" width="300" height="130" fill="#6e1522"/>
    <ellipse cx="150" cy="186" rx="112" ry="14" fill="#8a2433"/>
    <path d="M62 236 C66 262 96 288 134 294 L128 300 C86 296 56 268 50 236 Z" fill="#f4ecd8" opacity="0.5"/>
  </g>
  <path d="M150 300 C70 296 36 220 40 150 C44 95 70 55 85 40 L215 40 C230 55 256 95 260 150 C264 220 230 296 150 300 Z" fill="none" stroke="#1b1917" stroke-width="7" stroke-linejoin="round"/>
  <ellipse cx="150" cy="40" rx="65" ry="10" fill="none" stroke="#1b1917" stroke-width="6"/>
  <path d="M70 110 C60 140 60 170 66 200" stroke="#f4ecd8" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- MANIFESTO up the arm -->
  <text transform="translate(176 986) rotate(-90)" font-family="Impact,'Arial Narrow','Avenir Next Condensed',sans-serif" font-weight="normal" font-size="72" letter-spacing="7" fill="#f4ecd8">MANIFESTO</text>

  <!-- the line, stacked and left-aligned -->
  <g font-family="Impact,'Arial Narrow','Avenir Next Condensed',sans-serif" font-weight="normal" fill="#1b1917">
    <text x="272" y="596" font-size="112">ENJOY</text>
    <text x="272" y="706" font-size="112">IT</text>
    <text x="272" y="800" font-size="62" letter-spacing="1">MIGHTILY.</text>
  </g>
</svg>
